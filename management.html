<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пакком — Управленческий дашборд</title><style>body{margin:0;background:#08101c;color:#e7eef8;font:14px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.s{opacity:.8}</style></head><body><div class="s">Загружаю управленческий дашборд…</div><script>
(async()=>{
 const [baseResp,upResp]=await Promise.all([fetch('management-base-20261105.html',{cache:'no-store'}),fetch('data/management-update-20261108.json',{cache:'no-store'})]);
 if(!baseResp.ok||!upResp.ok)throw Error('load');
 let html=await baseResp.text(),sealed=await upResp.json();
 const re=/<script id="pakkom-sealed-release" type="application\\/json">([\\s\\S]*?)<\\/script>/,m=html.match(re);if(!m)throw Error('release');
 const r=JSON.parse(m[1]);
 r.previousUpdates=[...(r.previousUpdates||[]),r.payload];
 r.payload=sealed.payload;r.through=sealed.through;r.payloadFormat='pakkom-management-data-update-v1';
 html=html.replace(re,'<script id="pakkom-sealed-release" type="application/json">'+JSON.stringify(r).replace(/</g,'\\u003c')+'<\\/script>');
 const patch=`
function applyPakkomOrdersAfterCommissionV1(source){
 const m=source.match(/<script id="data" type="application\\/json">([\\s\\S]*?)<\\/script>/);if(!m)return source;
 const d=JSON.parse(m[1]);for(const x of d.daily||[]){if(Number.isFinite(x.ordersNetRub)){x.ordersRub=x.ordersNetRub;x.drr=x.ordersRub?(Number(x.ads)||0)/x.ordersRub:null;}}
 d.ordersAmountBasis='after_commission';d.ordersSourceBasis='after_commission';
 if(d.skuTotals){d.skuTotals.ordersRub=(d.daily||[]).reduce((s,x)=>s+(Number(x.ordersRub)||0),0);if('drr' in d.skuTotals)d.skuTotals.drr=d.skuTotals.ordersRub?d.skuTotals.ads/d.skuTotals.ordersRub:null;}
 if(d.business&&'ordersRub' in d.business){d.business.ordersRub=(d.daily||[]).reduce((s,x)=>s+(Number(x.ordersRub)||0),0);if('drr' in d.business)d.business.drr=d.business.ordersRub?d.business.ads/d.business.ordersRub:null;}
 const j=JSON.stringify(d).replace(/</g,'\\u003c'),p=m.index+m[0].indexOf(m[1]);return source.slice(0,p)+j+source.slice(p+m[1].length);
}
`;
 const marker="/* PAKKOM_MANAGEMENT_ACCESS_V10:";
 html=html.replace(marker,patch+'\\n'+marker);
 html=html.replace("if(!r.basePayload)return html;","if(!r.basePayload)return applyPakkomOrdersAfterCommissionV1(html);");
 html=html.replace("   return html;\\n  }\\n  function display","   return applyPakkomOrdersAfterCommissionV1(html);\\n  }\\n  function display");
 document.open();document.write(html);document.close();
})().catch(()=>{document.body.innerHTML='<div class="s">Не удалось загрузить дашборд. Обнови страницу.</div>';});
<\/script></body></html>
