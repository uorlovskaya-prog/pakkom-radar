<script>
// PAKKOM_MANAGEMENT_LIGHTWEIGHT_V3: preserve sealed base and ordered update chain.
function pakkomReleaseBlockV2(html){
 const open='<script id="pakkom-sealed-release" type="application/json">',close='</scr'+'ipt>';
 const a=html.indexOf(open),b=html.indexOf(close,a+open.length);
 if(a<0||b<0)throw Error('Missing sealed release');
 return {start:a+open.length,end:b,release:JSON.parse(html.slice(a+open.length,b))};
}
function pakkomMergeReleaseV2(base,sealeds){
 const r=pakkomReleaseBlockV2(base).release;
 if(!r.account||!r.payload)throw Error('Invalid sealed base');
 const list=Array.isArray(sealeds)?sealeds:[sealeds];
 for(const sealed of list){
  if(!sealed||!sealed.payload||!sealed.through)throw Error('Invalid sealed source');
  const prior=Array.isArray(sealed.previousPayloads)?sealed.previousPayloads:[];
  r.previousUpdates=[...(r.previousUpdates||[]),r.payload,...prior];
  r.payload=sealed.payload;r.through=sealed.through;r.payloadFormat='pakkom-management-data-update-v1';
 }
 const hashes=[...(r.previousUpdates||[]),r.payload].map(p=>p.sha256);
 if(hashes.some(x=>!x)||new Set(hashes).size!==hashes.length)throw Error('Invalid update chain');
 return r;
}
async function pakkomReadSourcesV2(config,pageUrl){
 const origin=new URL(pageUrl).origin,baseUrl=new URL(config.base,pageUrl);
 const paths=Array.isArray(config.updates)?config.updates:(config.update?[config.update]:[]);
 const updateUrls=paths.map(p=>new URL(p,pageUrl));
 if(baseUrl.origin!==origin||updateUrls.some(u=>u.origin!==origin))throw Error('Unexpected source origin');
 const options={cache:'no-store',credentials:'omit',redirect:'error'};
 const responses=await Promise.all([fetch(baseUrl,options),...updateUrls.map(u=>fetch(u,options))]);
 if(responses.some(r=>!r.ok))throw Error('Report source unavailable');
 const base=await responses[0].text(),sealeds=[];
 for(let i=1;i<responses.length;i++)sealeds.push(await responses[i].json());
 return {base,sealeds};
}
async function pakkomLatestReleaseV2(pageUrl){
 const response=await fetch(pageUrl,{cache:'no-store',credentials:'omit',redirect:'error'});
 if(!response.ok)throw Error('Report page unavailable');
 const html=await response.text();
 const doc=new DOMParser().parseFromString(html,'text/html');
 const config=doc.getElementById('pakkom-management-loader');
 if(!config)return pakkomReleaseBlockV2(html).release;
 const sources=await pakkomReadSourcesV2(JSON.parse(config.textContent),pageUrl);
 return pakkomMergeReleaseV2(sources.base,sources.sealeds);
}
function applyPakkomOrdersWithCommissionV2(source){
 const open='<script id="data" type="application/json">',close='</scr'+'ipt>';
 const a=source.indexOf(open),b=source.indexOf(close,a+open.length);if(a<0||b<0)return source;
 const d=JSON.parse(source.slice(a+open.length,b));
 for(const x of d.daily||[]){if(Number.isFinite(x.ordersNetRub)){x.ordersRub=x.ordersNetRub/0.70;x.drr=x.ordersRub?(Number(x.ads)||0)/x.ordersRub:null;}}
 d.ordersAmountBasis='with_commission';d.ordersSourceBasis='after_commission';
 if(d.skuTotals){d.skuTotals.ordersRub=(d.daily||[]).reduce((s,x)=>s+(Number(x.ordersRub)||0),0);if('drr' in d.skuTotals)d.skuTotals.drr=d.skuTotals.ordersRub?d.skuTotals.ads/d.skuTotals.ordersRub:null;}
 if(d.business&&'ordersRub' in d.business){d.business.ordersRub=(d.daily||[]).reduce((s,x)=>s+(Number(x.ordersRub)||0),0);if('drr' in d.business)d.business.drr=d.business.ordersRub?d.business.ads/d.business.ordersRub:null;}
 const json=JSON.stringify(d).replace(/</g,'\\u003c');return source.slice(0,a+open.length)+json+source.slice(b);
}
(async()=>{
 const config=JSON.parse(document.getElementById('pakkom-management-loader').textContent);
 const pageUrl=new URL(document.baseURI);pageUrl.hash='';
 const [sources,identityResp]=await Promise.all([
  pakkomReadSourcesV2(config,pageUrl),
  fetch('management-src/sku-identity-ng-v1.js',{cache:'no-store',credentials:'omit',redirect:'error'})
 ]);
 if(!identityResp.ok)throw Error('Identity module unavailable');
 let html=sources.base;
 const identity=(await identityResp.text()).trim(),identityBegin='/* PAKKOM_SKU_IDENTITY_NG_V1:',identityEnd="if(typeof module!=='undefined'&&module.exports)module.exports={applyPakkomSkuIdentityNgV1};";
 const ia=html.indexOf(identityBegin),ib=html.indexOf(identityEnd,ia+identityBegin.length);
 if(ia<0||ib<ia)throw Error('Identity module anchor');
 html=html.slice(0,ia)+identity+html.slice(ib+identityEnd.length);
 const block=pakkomReleaseBlockV2(html),release=pakkomMergeReleaseV2(html,sources.sealeds);
 html=html.slice(0,block.start)+JSON.stringify(release).replace(/</g,'\\u003c')+html.slice(block.end);
 const marker='/* PAKKOM_MANAGEMENT_ACCESS_V10:';
 if(html.split(marker).length!==2)throw Error('Unknown access loader');
 const patch=[pakkomReleaseBlockV2,pakkomMergeReleaseV2,pakkomReadSourcesV2,pakkomLatestReleaseV2,applyPakkomOrdersWithCommissionV2].map(fn=>fn.toString()).join('\n');
 html=html.replace(marker,()=>patch+'\n'+marker);
 const early='if(!r.basePayload)return html;';
 if(html.split(early).length!==2)throw Error('Unknown report content entry');
 html=html.replace(early,'if(!r.basePayload)return applyPakkomOrdersWithCommissionV2(html);');
 const end=/return html;(\s*\}\s*function\s+display\s*\()/g;
 if((html.match(end)||[]).length!==1)throw Error('Unknown report content boundary');
 html=html.replace(end,'return applyPakkomOrdersWithCommissionV2(html);$1');
 const refresh=/const response=await fetch\(url,[\s\S]*?const next=JSON\.parse\(match\[1\]\);validate\(next\);/g;
 if((html.match(refresh)||[]).length!==1)throw Error('Unknown report refresh loader');
 html=html.replace(refresh,'const next=await pakkomLatestReleaseV2(url);validate(next);');
 document.open();document.write(html);document.close();
})().catch(error=>{
 console.error('Pakkom management loader:',error.message);
 document.body.innerHTML='<div class="s">Не удалось загрузить дашборд. Обнови страницу.</div>';
});
</script></body></html>
