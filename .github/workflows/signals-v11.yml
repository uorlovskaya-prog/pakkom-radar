name: Check demand signals and management priorities
on:
  push:
    branches: [main]
    paths:
      - index.html
      - management.html
      - '*-base-*.html'
      - data/*.json
      - management-signals-v11.js
      - management-src/*.js
      - sku-identity-v4.js
      - ad-campaign-map-v1.json
      - tests/**
      - .github/workflows/signals-v11.yml
permissions:
  contents: read
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the current lightweight release before legacy UI tests
        run: node tests/lightweight-loaders-v2.cjs
      - name: Use immutable HTML bases for legacy UI regressions in this read-only CI workspace
        run: |
          cp index-base-20261105.html index.html
          cp management-base-20261105.html management.html
      - name: Demand and CPO regression checks
        run: node tests/management-signals-v11.cjs
      - name: Render, search, quick filters and SKU detail checks
        run: node tests/signals-ui-v11.cjs
      - name: Cyrillic NG aliases, history and encrypted owner login
        run: node tests/sku-identity-ng-v1.cjs
      - name: Advertising attribution and financial reconciliation
        run: node tests/ad-attribution-v1.cjs
      - name: Net profit percentage sorting
        run: node tests/profit-percent-sort-v1.cjs
      - name: Encrypted report data update
        run: node tests/report-data-update-v1.cjs
