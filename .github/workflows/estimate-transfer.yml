name: Check estimate release transfer
on:
  push:
    branches: [estimates-20261115-checked-transfer]
    paths: [.github/workflows/estimate-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify checked package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const ids=['6677187320b890ff35fb640540d112238c58037c','fbcd0844c593db14e3d491ab3f074a43b258ff1b','24cc54b7a32be5c4f30ebb0d20867538b5566c1c','47670c8abb3c0c784d37665ffeb3ffe29b87536f','272d948018ae2fb386bd3183ab03782ab814e84d','74efe68ab2063e7c56f0acea5fc778b6512175c2'];
          const expected=['ab956c624e48017a548b78c9ad8c812de554f301','fbcd0844c593db14e3d491ab3f074a43b258ff1b','24cc54b7a32be5c4f30ebb0d20867538b5566c1c','8a19ffa72beeec8b9b81dffe27a48d3ff4015897','272d948018ae2fb386bd3183ab03782ab814e84d','17b0ad1fecf5b20e561e01a0c6f525f27f001beb'];
          const tail='';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const gitsha=b=>createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length+'\0'),b])).digest('hex');
          const parts=[];
          for(let i=0;i<ids.length;i++){
            const r=await fetch('https://api.github.com/repos/uorlovskaya-prog/pakkom-radar/git/blobs/'+ids[i],{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
            if(!r.ok)throw Error('Read '+r.status);const d=await r.json();let s=Buffer.from(d.content,'base64').toString('base64');
            if(i===0)s=s.slice(0,4897)+'l'+s.slice(4898);
            if(i===3)for(const [a,b,t] of [[10924,10924,'4='],[5836,5839,'If'],[2105,2107,'Id'],[388,389,'']])s=s.slice(0,a)+t+s.slice(b);
            if(i===5)s=s.slice(0,6305)+tail;
            const bytes=Buffer.from(s,'base64');if(gitsha(bytes)!==expected[i])throw Error('Part checksum '+i);parts.push(bytes);
          }
          const all=Buffer.concat(parts),expectedPackage='c68f2d6fc3572499701ea8f53ab45af8458edba5a11a7b86e6a2567c7e7f4880';
          if(sha(all)!==expectedPackage)throw Error('Package checksum');
          const p=JSON.parse(gunzipSync(all));
          for(const [path,hash] of Object.entries(p.before))if(sha(fs.readFileSync(path))!==hash)throw Error('Baseline changed: '+path);
          const allowed=['index.html','management.html','operations-update-v1.js','estimate-view-v1.js','data/radar-estimates-20261115.json','data/management-estimates-20261115.json','tests/estimate-view-v1.cjs','ESTIMATES_HANDOFF.md','.github/workflows/signals-v11.yml'];
          if(p.files.length!==allowed.length)throw Error('Unexpected files');
          for(const f of p.files){if(!allowed.includes(f.path)||sha(f.content)!==f.sha256)throw Error('File checksum');fs.writeFileSync(f.path,f.content);}
          fs.writeFileSync('/tmp/estimate-package.json',JSON.stringify(p));console.log('PASS exact checked package; financial values remain encrypted');
          JS
      - name: Validate new and preserved behavior
        run: |
          node tests/lightweight-loaders-v2.cjs
          node tests/operations-update-v1.cjs
          node tests/estimate-view-v1.cjs
          cp index.html /tmp/index-candidate.html
          cp management.html /tmp/management-candidate.html
          trap 'cp /tmp/index-candidate.html index.html; cp /tmp/management-candidate.html management.html' EXIT
          cp index-base-20261105.html index.html
          cp management-base-20261105.html management.html
          node tests/management-signals-v11.cjs
          node tests/signals-ui-v11.cjs
          node tests/sku-identity-ng-v1.cjs
          node tests/ad-attribution-v1.cjs
          node tests/profit-percent-sort-v1.cjs
          node tests/report-data-update-v1.cjs
      - name: Store checked file blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import{createHash}from'node:crypto';
          const p=JSON.parse(fs.readFileSync('/tmp/estimate-package.json')),out=[];
          for(const f of p.files){const b=fs.readFileSync(f.path);if(createHash('sha256').update(b).digest('hex')!==f.sha256)throw Error('Changed during tests: '+f.path);const r=await fetch('https://api.github.com/repos/uorlovskaya-prog/pakkom-radar/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({encoding:'base64',content:b.toString('base64')})});if(!r.ok)throw Error('Store '+r.status);const d=await r.json();out.push({path:f.path,sha:d.sha,sha256:f.sha256});}
          fs.writeFileSync('estimate-transfer-result.json',JSON.stringify({packageSha256:'c68f2d6fc3572499701ea8f53ab45af8458edba5a11a7b86e6a2567c7e7f4880',baseCommit:'0a4856a6278b43d837afef5c421f1d565e92d7dd',files:out},null,2));console.log(JSON.stringify(out));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: estimate-checked-release
          path: estimate-transfer-result.json
          retention-days: 1
