name: Check paired report dates
on:
  push:
    branches: [main]
    paths:
      - index.html
      - management.html
      - '*-base-*.html'
      - data/*.json
      - tests/lightweight-loaders-v2.cjs
      - .github/workflows/paired-report-check.yml
  pull_request:
    paths:
      - index.html
      - management.html
      - '*-base-*.html'
      - data/*.json
      - tests/lightweight-loaders-v2.cjs
      - .github/workflows/paired-report-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute both loaders and verify dates, identity, encryption and refresh
        run: node tests/lightweight-loaders-v2.cjs
      - name: Verify both permanent Pages URLs after deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tests/lightweight-loaders-v2.cjs --live
