name: Verify public warehouse website
on:
  push:
    branches: [main]
    paths: [.github/workflows/warehouse-live-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live October site and September archive
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.request
          base='https://uorlovskaya-prog.github.io/pakkom-radar/sklad/'
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Pakkom-Warehouse-Live-Check'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert r.status==200, r.status
                  return r.read()
          for attempt in range(15):
              try:
                  raw=get(base+'?release=warehouse-2026-11-03-october-v1')
                  text=raw.decode('utf-8')
                  assert 'Октябрь 2026' in text
                  m=re.search(r'<script type="application/json" id="dashboardData">([\s\S]*?)</script>',text)
                  assert m, 'dashboardData missing'
                  data=json.loads(m.group(1))
                  assert data.get('totalQty')==88344, data.get('totalQty')
                  assert data.get('totalSec')==4892030, data.get('totalSec')
                  assert data.get('missingNormQty')==0, data.get('missingNormQty')
                  assert data.get('dayPersonCount')==229, data.get('dayPersonCount')
                  ver=json.loads(get(base+'version.json?release=warehouse-2026-11-03-october-v1'))
                  assert ver['periodFrom']=='2026-10-01' and ver['periodTo']=='2026-10-31'
                  assert ver['qty']==88344 and ver['rows']==8768 and ver['missingNormQty']==0
                  sept=get(base+'2026-09/?archive=1').decode('utf-8')
                  assert 'Сентябрь 2026' in sept
                  print('LIVE OCTOBER PASS:',base)
                  print('88344 packages; 4892030 norm-seconds; 229 person-days; 0 missing norms')
                  print('SEPTEMBER ARCHIVE PASS:',base+'2026-09/')
                  break
              except Exception as e:
                  if attempt==14: raise
                  print('Waiting for Pages deployment:',repr(e))
                  time.sleep(8)
          PY
