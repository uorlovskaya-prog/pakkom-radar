name: Check product identity
on:
  push:
    branches: [main]
    paths:
      - index.html
      - management.html
      - '*-base-*.html'
      - data/*.json
      - sku-identity-v4.js
      - tests/lightweight-loaders-v2.cjs
      - .github/workflows/pakkom-sku-v4.yml
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime date-SKU uniqueness, aliases, ID search and immutable source data
        run: node tests/lightweight-loaders-v2.cjs
