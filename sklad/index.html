<script>
const D=JSON.parse(document.getElementById('dashboardData').textContent);
const R=D.recipes, dates=D.dates, people=D.people;
const byPerson=new Map(), byDay=new Map(), byCell=new Map(), normMap=new Map();
for(const p of people)byPerson.set(p,{person:p,qty:0,sec:0,dates:new Map()});
for(const d of dates)byDay.set(d,[]);
for(const [di,pi,rr] of D.cells){
  const date=dates[di], person=people[pi]; let qty=0,sec=0,items=[];
  for(const [src,ri,q] of rr){const [wb,sku,norm,basis]=R[ri]; const s=q*norm; qty+=q;sec+=s;items.push({src,wb,sku,norm,basis,qty:q,sec:s});
    const nk=wb+'|'+sku+'|'+norm+'|'+basis;if(!normMap.has(nk))normMap.set(nk,{wb,sku,norm,basis,qty:0});normMap.get(nk).qty+=q;
  }
  const cell={date,person,qty,sec,items};byCell.set(person+'|'+date,cell);
  const p=byPerson.get(person);p.qty+=qty;p.sec+=sec;p.dates.set(date,cell);
  byDay.get(date).push(cell);
}
for(const a of byDay.values())a.sort((x,y)=>y.sec-x.sec);
for(const p of byPerson.values()){p.days=p.dates.size;p.avg=p.days?p.sec/p.days:0;const ar=[...p.dates.values()].map(x=>x.sec).sort((a,b)=>a-b);p.median=ar.length?(ar.length%2?ar[(ar.length-1)/2]:(ar[ar.length/2-1]+ar[ar.length/2])/2):0;}
const fmtN=n=>Math.round(n).toLocaleString('ru-RU');
const fmtT=s=>{s=Math.round(s);let h=Math.floor(s/3600),m=Math.round((s-h*3600)/60);if(m===60){h++;m=0}return h+' ч '+String(m).padStart(2,'0')+' мин'};
const fmtD=d=>{const [y,m,day]=d.split('-');return day+'.'+m};
const avgTeam=D.totalSec/D.dayPersonCount;
const stable=[...byPerson.values()].filter(x=>x.days>=5).sort((a,b)=>b.avg-a.avg);
const long=[...byPerson.values()].filter(x=>x.days>=10).sort((a,b)=>b.avg-a.avg);
function openCell(person,date){const c=byCell.get(person+'|'+date);if(!c)return;modalTitle.textContent=person+' · '+fmtD(date);modalSub.textContent=fmtN(c.qty)+' упаковок · '+fmtT(c.sec)+' по нормам';
 const items=[...c.items].sort((a,b)=>b.sec-a.sec);modalBody.innerHTML='<div class="tablewrap"><table><thead><tr><th>Товар</th><th>WB</th><th class="num">Уп.</th><th class="num">Норма</th><th class="num">Время</th></tr></thead><tbody>'+items.map(x=>`<tr><td>${esc(x.sku)}<div class="small">${esc(x.basis)}</div></td><td>${esc(x.wb||'—')}</td><td class="num">${fmtN(x.qty)}</td><td class="num">${fmtN(x.norm)} сек</td><td class="num">${fmtT(x.sec)}</td></tr>`).join('')+'</tbody></table></div>';modalBg.classList.add('open')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderOverview(){
 const top=stable.slice(0,10), bottom=long.slice(-5).reverse();
 const leader=stable[0], second=stable[1], third=stable[2];
 document.getElementById('view-overview').innerHTML=`
 <div class="kpis">
 <div class="card kpi"><span>Упаковок за октябрь</span><b>${fmtN(D.totalQty)}</b></div>
 <div class="card kpi"><span>Работа по нормам</span><b>${fmtT(D.totalSec)}</b></div>
 <div class="card kpi"><span>Дней × сотрудниц</span><b>${fmtN(D.dayPersonCount)}</b></div>
 <div class="card kpi"><span>Среднее на день с записью</span><b>${fmtT(avgTeam)}</b></div>
 <div class="card kpi"><span>Без нормы</span><b>${fmtN(D.missingNormQty)}</b></div></div>
 <div class="notice"><b>Итог для руководителя.</b> ${esc(leader.person)} — лидер октября: ${fmtT(leader.avg)} в среднем за собственный день и ${fmtN(leader.qty)} упаковок за месяц. ${esc(second.person)} и ${esc(third.person)} идут почти вровень: ${fmtT(second.avg)} и ${fmtT(third.avg)}.</div>
 <div class="grid2">
 <div class="card pad"><div class="section"><h2>Сильнейшие по среднему дню</h2><p>Основной рейтинг — не менее 5 дней с записью.</p></div>
 <table><thead><tr><th>#</th><th>Сотрудница</th><th class="num">Дней</th><th class="num">Упаковок</th><th class="num">Среднее</th><th class="num">Типичный день</th></tr></thead><tbody>
 ${top.map((p,i)=>`<tr><td class="rank">${i+1}</td><td><button class="link" data-person="${esc(p.person)}">${esc(p.person)}</button></td><td class="num">${p.days}</td><td class="num">${fmtN(p.qty)}</td><td class="num strong">${fmtT(p.avg)}</td><td class="num">${fmtT(p.median)}</td></tr>`).join('')}</tbody></table></div>
 <div class="card pad"><div class="section"><h2>Зона управленческой проверки</h2><p>Только сотрудницы с 10+ днями: меньше риск случайного вывода.</p></div>
 <table><thead><tr><th>Сотрудница</th><th class="num">Дней</th><th class="num">Среднее</th><th class="num">Типичный день</th></tr></thead><tbody>
 ${bottom.map(p=>`<tr><td><button class="link" data-person="${esc(p.person)}">${esc(p.person)}</button></td><td class="num">${p.days}</td><td class="num">${fmtT(p.avg)}</td><td class="num">${fmtT(p.median)}</td></tr>`).join('')}</tbody></table>
 <div class="notice warn"><b>Не трактовать как «плохо работает» автоматически.</b> В исходнике нет фактически отработанных часов и других обязанностей. Это список для проверки загрузки, заданий и организации смен.</div></div></div>
 <div class="section"><h2>Что изменилось в расчёте</h2><p>Все октябрьские позиции получили нормы; количество упаковок не менялось.</p></div>
 <div class="card pad"><p>Применены согласованные нормы и сопоставления по названию/фасовке для аналитики времени. Для рулонных пакетов: 100 шт. — 30 сек, 300 шт. — 60 сек, 500 шт. — 80 сек. Скатерти 2 и 6 шт. — 60 сек. «НГ микс» 250 мл × 50 — как «НГ», 30 сек. Пакеты «Свидание» 10 шт. одного вида — 60 сек. Рукописные 30×40, 5 цветов — как комплект 500 шт., 80 сек.</p></div>`;
 bindLinks();
}
function renderMatrix(){
 const plist=[...byPerson.values()].sort((a,b)=>b.avg-a.avg);
 let head='<tr><th>Сотрудница</th>'+dates.map(d=>'<th>'+fmtD(d)+'</th>').join('')+'<th>Дней</th><th>Среднее</th></tr>';
 let body=plist.map(p=>'<tr><td><b>'+esc(p.person)+'</b><div class="small">'+fmtN(p.qty)+' уп. за месяц</div></td>'+dates.map(d=>{let c=p.dates.get(d);if(!c)return'<td>—</td>';let day=byDay.get(d),rank=day.findIndex(x=>x.person===p.person)+1;return `<td class="${rank===1?'winner':''}"><button class="link cell" data-cell="${esc(p.person)}|${d}"><b>${fmtN(c.qty)} уп.</b><br>${fmtT(c.sec)}<br><span class="small">#${rank} в день</span></button></td>`}).join('')+`<td class="num">${p.days}</td><td class="num strong">${fmtT(p.avg)}</td></tr>`).join('');
 document.getElementById('view-matrix').innerHTML=`<div class="section"><h2>Табель по дням</h2><p>Фамилии слева, даты сверху. Нажми на ячейку — увидишь товары и нормы.</p></div><div class="card tablewrap"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
 bindLinks();
}
let selectedDay=dates[dates.length-1];
function renderDay(){
 const arr=byDay.get(selectedDay)||[];document.getElementById('view-day').innerHTML=`<div class="section"><h2>Кто сделал больше в выбранный день</h2><p>Сортировка по нормативной трудоёмкости, упаковки показаны отдельно.</p></div>
 <div class="controls"><select id="daySel">${dates.map(d=>`<option value="${d}" ${d===selectedDay?'selected':''}>${fmtD(d)}.2026</option>`).join('')}</select></div>
 <div class="card"><table><thead><tr><th>#</th><th>Сотрудница</th><th class="num">Упаковок</th><th class="num">Работа по нормам</th></tr></thead><tbody>${arr.map((c,i)=>`<tr><td class="rank">${i+1}</td><td><button class="link" data-cell="${esc(c.person)}|${selectedDay}">${esc(c.person)}</button></td><td class="num">${fmtN(c.qty)}</td><td class="num strong">${fmtT(c.sec)}</td></tr>`).join('')}</tbody></table></div>`;
 document.getElementById('daySel').onchange=e=>{selectedDay=e.target.value;renderDay()};bindLinks();
}
let pa=stable[0].person,pb=stable[1].person;
function renderCompare(){
 const opts=people.slice().sort((a,b)=>a.localeCompare(b,'ru'));
 const A=byPerson.get(pa),B=byPerson.get(pb),diff=A.avg-B.avg;
 const all=[...new Set([...A.dates.keys(),...B.dates.keys()])].sort();
 document.getElementById('view-compare').innerHTML=`<div class="section"><h2>Сравнить двух сотрудниц</h2><p>Каждая сравнивается по своим рабочим дням. Совпадение смен не требуется.</p></div>
 <div class="controls"><select id="pa">${opts.map(p=>`<option ${p===pa?'selected':''}>${esc(p)}</option>`).join('')}</select><span>и</span><select id="pb">${opts.map(p=>`<option ${p===pb?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
 <div class="grid2"><div class="card pad"><h3>${esc(A.person)}</h3><div style="font-size:30px;font-weight:700">${fmtT(A.avg)}</div><div class="small">в среднем за её ${A.days} дней · ${fmtN(A.qty)} упаковок</div></div>
 <div class="card pad"><h3>${esc(B.person)}</h3><div style="font-size:30px;font-weight:700">${fmtT(B.avg)}</div><div class="small">в среднем за её ${B.days} дней · ${fmtN(B.qty)} упаковок</div></div></div>
 <div class="notice"><b>${diff===0?'Средние равны':esc(diff>0?A.person:B.person)+' выше в среднем на '+fmtT(Math.abs(diff))+' за день'}.</b> Это сравнение объёма выполненной работы по нормам, а не фактической скорости.</div>
 <div class="card tablewrap"><table><thead><tr><th>Дата</th><th>${esc(A.person)}</th><th>${esc(B.person)}</th></tr></thead><tbody>${all.map(d=>{let a=A.dates.get(d),b=B.dates.get(d);return `<tr><td>${fmtD(d)}</td><td>${a?`<button class="link" data-cell="${esc(A.person)}|${d}">${fmtT(a.sec)} · ${fmtN(a.qty)} уп.</button>`:'—'}</td><td>${b?`<button class="link" data-cell="${esc(B.person)}|${d}">${fmtT(b.sec)} · ${fmtN(b.qty)} уп.</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`;
 document.getElementById('pa').onchange=e=>{pa=e.target.value;renderCompare()};document.getElementById('pb').onchange=e=>{pb=e.target.value;renderCompare()};bindLinks();
}
function renderShares(){
 const arr=[...byPerson.values()].sort((a,b)=>b.sec-a.sec);
 document.getElementById('view-shares').innerHTML=`<div class="section"><h2>Кто сколько внёс в общий объём</h2><p>Проценты используются только здесь — как доля общей работы команды.</p></div><div class="card tablewrap"><table><thead><tr><th>Сотрудница</th><th class="num">Дней</th><th class="num">Упаковок</th><th>Доля упаковок</th><th class="num">Работа</th><th>Доля работы</th></tr></thead><tbody>${arr.map(p=>{let q=100*p.qty/D.totalQty,s=100*p.sec/D.totalSec;return `<tr><td>${esc(p.person)}</td><td class="num">${p.days}</td><td class="num">${fmtN(p.qty)}</td><td>${q.toFixed(1).replace('.',',')}%<div class="bar"><i style="width:${q}%"></i></div></td><td class="num">${fmtT(p.sec)}</td><td>${s.toFixed(1).replace('.',',')}%<div class="bar"><i style="width:${s}%"></i></div></td></tr>`}).join('')}</tbody></table></div>`;
}
function renderNorms(){
 const arr=[...normMap.values()].sort((a,b)=>b.qty-a.qty);
 document.getElementById('view-norms').innerHTML=`<div class="section"><h2>Нормы, применённые в октябре</h2><p>Секунды на одну готовую упаковку. Исходный WB сохраняется.</p></div><div class="card tablewrap"><table><thead><tr><th>WB</th><th>Товар</th><th class="num">Упаковок</th><th class="num">Норма</th><th>Основание</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.wb||'—')}</td><td>${esc(x.sku)}</td><td class="num">${fmtN(x.qty)}</td><td class="num">${fmtN(x.norm)} сек</td><td class="small">${esc(x.basis)}</td></tr>`).join('')}</tbody></table></div>`;
}
function bindLinks(){document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{let [p,d]=b.dataset.cell.split('|');openCell(p,d)});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{pa=b.dataset.person;pb=stable.find(x=>x.person!==pa)?.person||people[0];show('compare');renderCompare()})}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.getElementById('view-'+v).classList.add('active');({overview:renderOverview,matrix:renderMatrix,day:renderDay,compare:renderCompare,shares:renderShares,norms:renderNorms}[v])()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.view));modalClose.onclick=()=>modalBg.classList.remove('open');modalBg.onclick=e=>{if(e.target===modalBg)modalBg.classList.remove('open')};
renderOverview();
</script></body></html>
