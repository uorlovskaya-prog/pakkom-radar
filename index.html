<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пакком — SKU Radar</title><style>body{margin:0;background:#08101c;color:#e7eef8;font:14px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.s{opacity:.8}</style></head><body><div class="s">Загружаю актуальный Radar…</div><script>
(async()=>{
 const [baseResp,upResp]=await Promise.all([fetch('index-base-20261105.html',{cache:'no-store'}),fetch('data/radar-update-20261108.json',{cache:'no-store'})]);
 if(!baseResp.ok||!upResp.ok)throw Error('load');
 let html=await baseResp.text(),up=await upResp.json();
 const re=/<script id="data" type="application\\/json">([\\s\\S]*?)<\\/script>/,m=html.match(re);if(!m)throw Error('data');
 const d=JSON.parse(m[1]);
 // Canonical project rule: ordersRub is already AFTER WB commission.
 for(const r of d.daily||[]){if(Number.isFinite(r.ordersNetRub)){r.ordersRub=r.ordersNetRub;r.drr=r.ordersRub?(Number(r.ads)||0)/r.ordersRub:null;}}
 d.daily=(d.daily||[]).filter(r=>r.iso<'2026-11-06').concat(up.rows||[]);
 d.through=up.through;
 d.weeks=(d.weeks||[]).filter(w=>w.key!=='2026-11-02');
 d.weeks.push({key:'2026-11-02',start:'2026-11-02',end:'2026-11-08',label:'02.11–08.11'});
 d.ordersAmountBasis='after_commission';d.ordersSourceBasis='after_commission';d.ordersCommissionRate=0.3;
 d.note='Данные по 08.11.2026. Заказы в ₽ — сумма после комиссии WB напрямую.';
 const json=JSON.stringify(d).replace(/</g,'\\u003c');
 html=html.replace(re,'<script id="data" type="application/json">'+json+'<\\/script>');
 document.open();document.write(html);document.close();
})().catch(()=>{document.body.innerHTML='<div class="s">Не удалось загрузить Radar. Обнови страницу.</div>';});
<\/script></body></html>
